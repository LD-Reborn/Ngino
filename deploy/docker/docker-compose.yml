services:
  ngino-server:
    image: git.ld50.dev/ngino/ngino-server:latest
    container_name: ngino-server
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - NGINO_TOKEN=${NGINO_TOKEN:-change-me}
      - NGINO_CHUNK_SIZE=${NGINO_CHUNK_SIZE:-65536}
      - NGINO_SECURE_COOKIES=${NGINO_SECURE_COOKIES:-true}
      - ConnectionStrings__ElmahConnection=Server=${MYSQL_HOST:-mysql};Port=${MYSQL_PORT:-3306};Database=${MYSQL_DATABASE:-elmah};User Id=${MYSQL_USER:-elmah};Password=${MYSQL_PASSWORD:-elmah};
    volumes:
      - ngino-appdata:/app/App_Data
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: ngino-mysql
    ports:
      - "13306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=elmah
      - MYSQL_USER=elmah
      - MYSQL_PASSWORD=elmah
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  ngino-appdata:
    driver: local
  mysql-data:
    driver: local
